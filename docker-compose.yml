services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relaydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaydesk}
      POSTGRES_DB: ${POSTGRES_DB:-relaydesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      APP_NAME: ${APP_NAME:-Relaydesk}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://relaydesk:relaydesk@postgres:5432/relaydesk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-inbound.localhost}
      IMAP_HOST: ${IMAP_HOST:-greenmail}
      IMAP_PORT: ${IMAP_PORT:-3143}
      IMAP_USERNAME: ${IMAP_USERNAME:-relaydesk@localhost}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-relaydesk}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-false}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-greenmail}
      SMTP_PORT: ${SMTP_PORT:-3025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Relaydesk}
      OUTBOUND_FROM_ADDRESS: ${OUTBOUND_FROM_ADDRESS:-}
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-120}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/relaydesk/attachments}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
      # The only proxy this API should ever believe an X-Forwarded-For
      # header from. The public ticket form's server action (apps/web/app/
      # (portal)/submit-ticket/actions.ts) forwards the portal visitor's
      # address on every call it makes to this service; the API only reads
      # that header back off a peer listed here (see
      # relaydesk/services/client_ip.py) -- anyone else's copy of the
      # header is ignored, and the visitor's raw socket address is used
      # instead. Empty (the setting's own default) means "trust nobody,"
      # which is safe against a forged header but collapses every portal
      # visitor onto the `web` container's address: one shared bucket of
      # five tickets an hour for the whole product, with nothing to signal
      # it. So the value is pinned to the static address the `web` service
      # is given on the network declared at the bottom of this file. Both
      # halves are fixed here rather than handed out by Docker's allocator,
      # so they cannot drift apart across `docker compose down && up`.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.20.255.8}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - attachments:/var/lib/relaydesk/attachments
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  greenmail:
    image: greenmail/standalone:2.1.0
    environment:
      # `setup.test.all` opens SMTP 3025, POP3 3110, IMAP 3143 (plus TLS
      # variants) against a single store, so mail we send is mail we can then
      # poll. `auth.disabled` auto-creates any mailbox on first use, which is
      # what lets a fresh clone work with no account setup.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025"
      - "3143:3143"

  worker:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://relaydesk:relaydesk@postgres:5432/relaydesk}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-inbound.localhost}
      IMAP_HOST: ${IMAP_HOST:-greenmail}
      IMAP_PORT: ${IMAP_PORT:-3143}
      IMAP_USERNAME: ${IMAP_USERNAME:-relaydesk@localhost}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-relaydesk}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-false}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-greenmail}
      SMTP_PORT: ${SMTP_PORT:-3025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Relaydesk}
      OUTBOUND_FROM_ADDRESS: ${OUTBOUND_FROM_ADDRESS:-}
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-120}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/relaydesk/attachments}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - attachments:/var/lib/relaydesk/attachments
    command: celery -A relaydesk.worker.app worker --loglevel=info --concurrency=2

  beat:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://relaydesk:relaydesk@postgres:5432/relaydesk}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-inbound.localhost}
      IMAP_HOST: ${IMAP_HOST:-greenmail}
      IMAP_PORT: ${IMAP_PORT:-3143}
      IMAP_USERNAME: ${IMAP_USERNAME:-relaydesk@localhost}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-relaydesk}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-false}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-greenmail}
      SMTP_PORT: ${SMTP_PORT:-3025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Relaydesk}
      OUTBOUND_FROM_ADDRESS: ${OUTBOUND_FROM_ADDRESS:-}
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-120}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/relaydesk/attachments}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A relaydesk.worker.app beat --loglevel=info

  web:
    build: ./apps/web
    environment:
      API_URL: ${API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_PORTAL_DOMAIN: ${PORTAL_DOMAIN:-localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    # No published port. The reverse proxy is the only thing that may reach
    # this container, which is what lets middleware.ts trust the
    # X-Forwarded-For it receives. See the comment there.
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    # Pinned, not allocated. The API's TRUSTED_PROXY_IPS above has to name
    # this exact container: it is the only peer whose X-Forwarded-For the
    # API believes, and that header is how a portal visitor's own address
    # reaches the ticket rate limiter. Let Docker's allocator choose this
    # and the two values drift apart on the next full recreate, at which
    # point every visitor silently shares one bucket.
    networks:
      default:
        ipv4_address: 172.20.255.8
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web

# A fixed subnet so the address above is ours to assign rather than
# Docker's to hand out. The static address sits high in the range on
# purpose: Docker allocates dynamic addresses sequentially from .2, and
# this stack has enough services to reach into the low addresses.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  rabbitmq-data:
  attachments:
